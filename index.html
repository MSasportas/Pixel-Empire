<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pixel Empire</title>
  <!-- The game's logo: shows on browser tabs, bookmarks and phone home screens -->
  <link rel="icon" href="favicon.ico?v=2" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=2">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <meta name="theme-color" content="#0b0618">
  <meta name="apple-mobile-web-app-title" content="Pixel Empire">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Free pixel fonts from Google Fonts (Open Font License) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- The office, drawn with pixel art -->
  <div id="office-wrap"><canvas id="office"></canvas></div>

  <!-- Title screen -->
  <div id="title" class="screen">
    <div class="title-box">
      <h1 class="logo">PIXEL<br>EMPIRE</h1>
      <p class="tagline">From one desk to a AAA game studio</p>
      <div id="slots" class="slots"></div>
    </div>
  </div>

  <!-- Character creation -->
  <div id="create" class="screen hidden">
    <div class="panel create-box">
      <div class="panel-head"><h2>Design your studio person</h2></div>
      <div id="create-body"></div>
    </div>
  </div>

  <!-- The HUD: small boxes in the corners.
       On phones the same boxes turn into a slim bar at the top
       (hud-top) and a button bar at the bottom (hud-nav). The other
       buttons hide in a "More" menu that slides up. See style.css. -->
  <div id="hud" class="hidden">
    <div id="hud-top">
      <div class="hud-box tl">
        <div class="hud-line h-money"><span class="hud-label">Money</span> <b id="hud-money" class="pink">$0</b> <span id="hud-money-rate" class="hud-rate"></span></div>
        <div class="hud-line h-players"><span class="hud-label">Players</span> <b id="hud-players" class="cyan">0</b> <span id="hud-players-rate" class="hud-rate"></span></div>
        <div class="hud-line h-date"><span class="hud-label">Date</span> <span id="hud-time" class="hud-date">January 1, Year 1</span></div>
      </div>
      <div class="hud-box tr">
        <div class="hud-line h-fans"><span class="hud-label">Fans</span> <b id="hud-fans" class="yellow">0</b> <span id="hud-fans-rate" class="hud-rate"></span></div>
        <div class="h-levelrow">
          <div class="hud-line h-level"><b id="hud-level">Solo Developer</b></div>
          <div class="bar"><div id="hud-level-bar" class="bar-fill"></div></div>
        </div>
        <div id="hud-level-next" class="hud-small"></div>
        <div class="hud-goal"><span class="hud-small">AAA goal</span><div class="bar goal"><div id="hud-goal-bar" class="bar-fill"></div></div></div>
      </div>
    </div>
    <!-- Tapping the dark screen behind the More menu closes it -->
    <div id="nav-scrim" data-act="nav-close"></div>
    <div id="hud-nav">
      <div class="hud-box bl">
        <button id="btn-make" class="btn" data-act="open" data-name="make">Make a game</button>
        <button class="btn ghost" data-act="open" data-name="store">Store <span id="store-badge" class="badge new hidden">NEW</span></button>
        <button id="btn-games" class="btn ghost" data-act="open" data-name="games">Games (0)</button>
        <button class="btn ghost" data-act="open" data-name="team">Team</button>
      </div>
      <div class="hud-box br">
        <button class="btn ghost" data-act="open" data-name="mail">Mail <span id="mail-badge" class="badge hidden">0</span></button>
        <button class="btn ghost" data-act="open" data-name="trophies">Trophies</button>
        <button class="btn ghost" data-act="open" data-name="menu">Menu</button>
      </div>
      <!-- Only on phones: opens and closes the More menu. The dot means
           something new is waiting inside. -->
      <button id="btn-more" class="btn ghost" data-act="nav-more" aria-expanded="false">More<span id="more-dot" class="more-dot hidden"></span></button>
    </div>
    <div id="topcenter">
      <div id="guide" class="guide hidden"></div>
      <div id="toast" class="toast hidden"></div>
    </div>
  </div>

  <!-- Pop-ups -->
  <div id="panel" class="overlay hidden"></div>
  <div id="card" class="overlay hidden"></div>
  <div id="minigame" class="overlay hidden"></div>
  <div id="banner" class="banner hidden"></div>

  <!-- The game's code. Each file has its own job. -->
  <script src="js/config.js"></script>     <!-- all the numbers -->
  <script src="js/game.js"></script>       <!-- the rules -->
  <script src="js/office.js"></script>     <!-- pixel-art office -->
  <script src="js/music.js"></script>      <!-- music and sounds -->
  <script src="js/minigames.js"></script>  <!-- speed-up mini-games -->
  <script src="js/ui.js"></script>         <!-- screens and buttons -->
  <script src="js/main.js"></script>       <!-- starts everything -->
</body>
</html>
