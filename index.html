<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Empire</title>
  <!-- Free pixel fonts from Google Fonts (Open Font License) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- The office, drawn with pixel art -->
  <div id="office-wrap"><canvas id="office"></canvas></div>

  <!-- Title screen -->
  <div id="title" class="screen">
    <div class="title-box">
      <h1 class="logo">PIXEL<br>EMPIRE</h1>
      <p class="tagline">From one desk to a AAA game studio</p>
      <div id="slots" class="slots"></div>
    </div>
  </div>

  <!-- Character creation -->
  <div id="create" class="screen hidden">
    <div class="panel create-box">
      <div class="panel-head"><h2>Design your studio person</h2></div>
      <div id="create-body"></div>
    </div>
  </div>

  <!-- The HUD: small boxes in the corners -->
  <div id="hud" class="hidden">
    <div class="hud-box tl">
      <div class="hud-line"><span class="hud-label">Money</span> <b id="hud-money" class="pink">$0</b> <span id="hud-money-rate" class="hud-rate"></span></div>
      <div class="hud-line"><span class="hud-label">Players</span> <b id="hud-players" class="cyan">0</b> <span id="hud-players-rate" class="hud-rate"></span></div>
      <div class="hud-line"><span class="hud-label">Time played</span> <span id="hud-time" class="hud-rate">0s</span></div>
    </div>
    <div class="hud-box tr">
      <div class="hud-line"><span class="hud-label">Fans</span> <b id="hud-fans" class="yellow">0</b> <span id="hud-fans-rate" class="hud-rate"></span></div>
      <div class="hud-line"><b id="hud-level">Solo Developer</b></div>
      <div class="bar"><div id="hud-level-bar" class="bar-fill"></div></div>
      <div id="hud-level-next" class="hud-small"></div>
      <div class="hud-goal"><span class="hud-small">AAA goal</span><div class="bar goal"><div id="hud-goal-bar" class="bar-fill"></div></div></div>
    </div>
    <div class="hud-box bl">
      <button id="btn-make" class="btn" data-act="open" data-name="make">Make a game</button>
      <button class="btn ghost" data-act="open" data-name="store">Store</button>
      <button id="btn-games" class="btn ghost" data-act="open" data-name="games">Games (0)</button>
      <button class="btn ghost" data-act="open" data-name="team">Team</button>
    </div>
    <div class="hud-box br">
      <button class="btn ghost" data-act="open" data-name="mail">Mail <span id="mail-badge" class="badge hidden">0</span></button>
      <button class="btn ghost" data-act="open" data-name="trophies">Trophies</button>
      <button class="btn ghost" data-act="open" data-name="menu">Menu</button>
    </div>
    <div id="topcenter">
      <div id="guide" class="guide hidden"></div>
      <div id="toast" class="toast hidden"></div>
    </div>
  </div>

  <!-- Pop-ups -->
  <div id="panel" class="overlay hidden"></div>
  <div id="card" class="overlay hidden"></div>
  <div id="minigame" class="overlay hidden"></div>
  <div id="banner" class="banner hidden"></div>

  <!-- The game's code. Each file has its own job. -->
  <script src="js/config.js"></script>     <!-- all the numbers -->
  <script src="js/game.js"></script>       <!-- the rules -->
  <script src="js/office.js"></script>     <!-- pixel-art office -->
  <script src="js/music.js"></script>      <!-- music and sounds -->
  <script src="js/minigames.js"></script>  <!-- speed-up mini-games -->
  <script src="js/ui.js"></script>         <!-- screens and buttons -->
  <script src="js/main.js"></script>       <!-- starts everything -->
</body>
</html>
