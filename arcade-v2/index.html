<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pixel Empire Arcade (test 2)</title>
  <link rel="icon" href="../favicon.ico?v=2" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#0b0618">
  <!-- Free pixel fonts from Google Fonts (Open Font License) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/arcade.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/v2.css">
</head>
<body>
  <!-- The arcade, drawn with pixel art -->
  <canvas id="arcade"></canvas>
  <!-- Clear text and icons, drawn sharp on top of the pixel art -->
  <canvas id="labels"></canvas>

  <!-- Title screen -->
  <div id="title" class="screen">
    <div class="title-box">
      <h1 class="logo">PIXEL<br>EMPIRE</h1>
      <p class="arcade-logo">ARCADE</p>
      <p class="tagline">Run your own neon arcade</p>
      <p class="test-tag">TEST VERSION 2 · made for phones held upright</p>
      <div id="slots" class="slots"></div>
    </div>
  </div>

  <!-- Making a new arcade -->
  <div id="create" class="screen hidden">
    <div class="panel create-box">
      <div class="panel-head"><h2>Your new arcade</h2></div>
      <div id="create-body"></div>
    </div>
  </div>

  <!-- The boxes in the corners -->
  <div id="hud" class="hidden">
    <div class="hud-box tl">
      <div class="hud-line h-money" title="Money"><span class="hi" data-icon="coin"></span> <b id="hud-money">$0</b></div>
      <div class="hud-line h-cust" title="Customers"><span class="hi" data-icon="people"></span><span class="meter crowd-bar"><span id="hud-crowd"></span></span><b id="hud-full" class="full-word hidden">FULL</b></div>
      <div class="hud-line h-fame" data-act="fame" title="Fame Road"><span class="hi" data-icon="star"></span><span class="meter fame-bar"><span id="hud-fame-bar"></span></span></div>
    </div>
    <div class="hud-box tr"><button id="btn-mech" class="btn ghost" data-act="mechanics" aria-label="Mechanics"><span class="btn-icon hi" data-icon="wrench"></span><span class="btn-text">Mechanics</span><span class="btn-bar"><span id="mech-bar"></span></span><span class="pad-hint">X</span></button> <button id="btn-shop" class="btn" data-act="shop"><span class="btn-icon hi" data-icon="cart"></span><span class="btn-text">Shop</span><span class="pad-hint">RB</span></button> <button id="btn-menu" class="btn ghost" data-act="menu"><span class="btn-icon hi" data-icon="menu"></span><span class="btn-text">Menu</span><span class="pad-hint">☰</span></button></div>
    <button id="prompt" class="hidden"></button>
    <!-- Zoom buttons (you can also pinch, use the mouse wheel, + and - keys, or the controller's bumpers) -->
    <div id="zoom-box">
      <button id="zoom-in" class="btn ghost zoom-btn" aria-label="Zoom in">+</button>
      <button id="zoom-out" class="btn ghost zoom-btn" aria-label="Zoom out">−</button>
      <button id="zoom-me" class="btn ghost zoom-btn hidden" aria-label="Back to me">◎</button>
    </div>
    <div id="topcenter"><div id="toast" class="toast hidden"></div></div>
    <div id="flash" class="hidden"></div>
  </div>

  <!-- Pop-ups -->
  <div id="panel" class="overlay hidden"></div>
  <div id="card" class="overlay hidden"></div>
  <div id="minigame" class="overlay hidden"></div>
  <div id="banner" class="banner hidden"></div>
  <!-- The controller's pointer in menus -->
  <div id="pad-cursor" class="hidden"></div>

  <!-- The game's code. Each file has its own job. -->
  <script src="js/icons.js"></script>      <!-- our own pixel icons -->
  <script src="js/config.js"></script>     <!-- all the numbers -->
  <script src="js/game.js"></script>       <!-- the rules -->
  <script src="js/art.js"></script>        <!-- pixel art -->
  <script src="js/systems-art.js"></script> <!-- art for the Counter, Mechanics and Fame Road -->
  <script src="js/music.js"></script>      <!-- music and sounds -->
  <script src="js/minigames.js"></script>  <!-- mini-games -->
  <script src="js/input.js"></script>      <!-- keyboard, controller, touch -->
  <script src="js/ui.js"></script>         <!-- screens and buttons -->
  <script src="js/systems-ui.js"></script>
  <script src="js/juice.js"></script>       <!-- flying coins, celebrations, controller menus --> <!-- screens for the Counter, Mechanics and Fame Road -->
  <script src="js/main.js"></script>       <!-- starts everything -->
</body>
</html>
